<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- white tile with heavy black border, matching the other Boccia Australia app icons -->
  <rect x="26" y="26" width="972" height="972" rx="214" fill="#ffffff" stroke="#000000" stroke-width="24"/>

  <!-- clock face: red half (left) / blue half (right), like the two side panels -->
  <path d="M512 152 A360 360 0 0 0 512 872 Z" fill="#ff2244"/>
  <path d="M512 152 A360 360 0 0 1 512 872 Z" fill="#2266ff"/>
  <line x1="512" y1="152" x2="512" y2="872" stroke="#000000" stroke-width="12"/>

  <!-- outer ring: yellow, outlined in black so it holds against the white tile -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#000000" stroke-width="48"/>
  <circle cx="512" cy="512" r="360" fill="none" stroke="#ffea00" stroke-width="28"/>

  <!-- quarter marks in boccia green, outlined so they read on both halves -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#000000" stroke-width="38">
      <line x1="512" y1="188" x2="512" y2="258"/>
      <line x1="512" y1="188" x2="512" y2="258" transform="rotate(90 512 512)"/>
      <line x1="512" y1="188" x2="512" y2="258" transform="rotate(180 512 512)"/>
      <line x1="512" y1="188" x2="512" y2="258" transform="rotate(270 512 512)"/>
    </g>
    <g stroke="#018050" stroke-width="24">
      <line x1="512" y1="188" x2="512" y2="258"/>
      <line x1="512" y1="188" x2="512" y2="258" transform="rotate(90 512 512)"/>
      <line x1="512" y1="188" x2="512" y2="258" transform="rotate(180 512 512)"/>
      <line x1="512" y1="188" x2="512" y2="258" transform="rotate(270 512 512)"/>
    </g>
  </g>

  <!-- minor ticks -->
  <g stroke="#ffea00" stroke-linecap="round" stroke-width="14">
    <line x1="512" y1="192" x2="512" y2="234" transform="rotate(30 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="234" transform="rotate(60 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="234" transform="rotate(120 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="234" transform="rotate(150 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="234" transform="rotate(210 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="234" transform="rotate(240 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="234" transform="rotate(300 512 512)"/>
    <line x1="512" y1="192" x2="512" y2="234" transform="rotate(330 512 512)"/>
  </g>

  <!-- hands at 10:10, outlined in black -->
  <g stroke-linecap="round">
    <g stroke="#000000">
      <line x1="512" y1="512" x2="373" y2="414" stroke-width="60"/>
      <line x1="512" y1="512" x2="729" y2="387" stroke-width="48"/>
    </g>
    <g stroke="#ffea00">
      <line x1="512" y1="512" x2="373" y2="414" stroke-width="46"/>
      <line x1="512" y1="512" x2="729" y2="387" stroke-width="34"/>
    </g>
  </g>
  <circle cx="512" cy="512" r="40" fill="#000000"/>
  <circle cx="512" cy="512" r="30" fill="#ffea00"/>
</svg>
